services:
  knox-ldap:
    image: apache/knox:3.0.0-release@sha256:058733ba7de9b6f7a37f850a50db343ebb8d0e72bc6bd5ecf668736906f2034c
    entrypoint: ["/home/knox/knox/bin/ldap.sh"]
    command: ["start"]
    environment:
      KNOX_LDAP_RUNNING_IN_FOREGROUND: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/33389'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    networks:
      - backend

  knox-gateway:
    image: apache/knox:3.0.0-release@sha256:058733ba7de9b6f7a37f850a50db343ebb8d0e72bc6bd5ecf668736906f2034c
    depends_on:
      namenode:
        condition: service_healthy
      knox-ldap:
        condition: service_healthy
    environment:
      IMPORT_LETS_ENCRYPT_STAGING_CERTS: "false"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./knox/topologies/demo.xml:/home/knox/knox/conf/topologies/demo.xml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          status=$$(curl --insecure --silent --show-error --output /dev/null --write-out '%{http_code}'
          'https://127.0.0.1:8443/gateway/demo/webhdfs/v1/demo?op=LISTSTATUS') &&
          test "$$status" = "401"
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 45s
    networks:
      - backend
