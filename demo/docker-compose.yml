name: apache-knox-bigdata-demo

services:
  namenode:
    image: apache/hadoop:3.4.3
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /data/name/current
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs_namenode:/data/name
    # CHI GIAI DOAN 1: mo port tren localhost de kiem tra WebHDFS.
    # KHI THEM KNOX: XOA muc 'ports' nay de backend khong exposed tren host.
    ports:
      - "127.0.0.1:9870:9870"
    networks:
      - backend

  datanode:
    image: apache/hadoop:3.4.3
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs_datanode:/data/data
    networks:
      - backend

volumes:
  hdfs_namenode:
  hdfs_datanode:

networks:
  backend:
    driver: bridge
